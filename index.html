<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>KLUX</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: 'Segoe UI', system-ui, sans-serif;
        color: #e0e0e0;
      }

      #app {
        width: 100%; height: 100%;
        display: flex;
        flex-direction: column;
        align-items: stretch;
        position: relative;
      }

      #game-canvas {
        display: block;
        flex: 1;
        min-height: 0;           /* lets flex shrink the canvas when #osc is present */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      /* ── On-screen controls ─────────────────────────────── */
      #osc {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 12px;
        padding-bottom: max(8px, env(safe-area-inset-bottom));
        background: rgba(10, 12, 24, 0.92);
        border-top: 1px solid rgba(255,255,255,0.07);
      }

      .osc-game-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .osc-row {
        display: flex;
        gap: 6px;
        justify-content: center;
      }

      .osc-btn {
        flex: 1;
        max-width: 120px;
        padding: 12px 6px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px;
        background: rgba(255,255,255,0.07);
        color: #d0d0e8;
        font-size: 15px;
        font-family: inherit;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        transition: background 0.08s;
      }
      .osc-btn:active,
      .osc-btn.pressed { background: rgba(255,255,255,0.22); }

      .osc-flip  { background: rgba(6,214,160,0.12);  border-color: rgba(6,214,160,0.3); }
      .osc-drop  { max-width: 180px; padding: 14px 6px; font-size: 17px;
                   background: rgba(67,97,238,0.2); border-color: rgba(67,97,238,0.4); }
      .osc-pause { max-width: 56px; }

      .osc-confirm {
        width: 100%;
        max-width: 100%;
        padding: 16px;
        font-size: 18px;
        font-weight: bold;
        letter-spacing: 0.05em;
        background: rgba(67,97,238,0.3);
        border-color: rgba(67,97,238,0.6);
      }

      .osc-mode-picker {
        display: flex;
        gap: 8px;
      }
      .osc-mode {
        flex: 1;
        max-width: none;
        padding: 16px;
        font-size: 17px;
        font-weight: bold;
        letter-spacing: 0.06em;
      }
      .osc-mode[data-cmd="START_CLASSIC"] {
        background: rgba(67,97,238,0.3);
        border-color: rgba(67,97,238,0.6);
      }
      .osc-mode[data-cmd="START_ENDLESS"] {
        background: rgba(244,162,97,0.25);
        border-color: rgba(244,162,97,0.55);
      }

      .osc-mute {
        position: absolute;
        top: max(8px, env(safe-area-inset-top));
        right: max(8px, env(safe-area-inset-right));
        z-index: 5;
        width: 40px;
        height: 40px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 50%;
        background: rgba(10,12,24,0.8);
        color: #d0d0e8;
        font-size: 18px;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      .osc-mute:active { background: rgba(255,255,255,0.18); }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <!-- #osc is injected here by OnScreenControls when applicable -->
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
